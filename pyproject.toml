[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryweave"
version = "1.0.0"
description = "Universal long-term memory for any LLM application"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ravi Kashyap", email = "kashyap01212@gmail.com" }]
keywords = ["llm", "memory", "ai", "rag", "knowledge-graph", "nlp", "vector-search"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.0",
  "spacy>=3.7",
  "sentence-transformers>=2.2",
  "chromadb>=0.4",
  "networkx>=3.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "httpx>=0.25.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-asyncio>=0.21",
  "ruff>=0.1.0",
  "pre-commit>=3.0",
  "httpx>=0.25.0",
  "fastapi>=0.104.0",
]

[project.urls]
Homepage = "https://github.com/ravii-k/memoryweave"
Repository = "https://github.com/ravii-k/memoryweave"
Documentation = "https://github.com/ravii-k/memoryweave#readme"
"Bug Tracker" = "https://github.com/ravii-k/memoryweave/issues"
Changelog = "https://github.com/ravii-k/memoryweave/blob/main/CHANGELOG.md"

[project.scripts]
memoryweave-server = "memoryweave.server:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["memoryweave*"]
exclude = ["tests*", "examples*", "sdk*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=memoryweave --cov-report=xml --cov-fail-under=20"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "D"]
ignore = [
  "D100",
  "D104",
  "D105",
  "D107",
  "D213",
  "D401",
  "D403",
  "D413",
  "UP037",
  "ANN101",
  "ANN102",
  "ANN401",
  "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001", "D101", "D102", "D103"]

[tool.coverage.run]
source = ["memoryweave"]
omit = ["memoryweave/server.py"]

[tool.coverage.report]
show_missing = true
